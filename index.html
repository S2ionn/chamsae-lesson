<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참새 노래 수업</title>
<style>
  /* 연노랑 공책 위에 흰 정간보 종이를 올린 16:9 수업 화면. 위는 음원 탭, 아래는 도입·전개·정리 */
  :root {
    --page: #f6eab4;
    --bg: #fffadf;
    --paper: #ffffff;
    --ink: #3a2a14;
    --sub: #7b5d2c;
    --line: #3a2a14;
    --soft: #f0e2a6;
    --faint: #c9b577;
    --accent: #d2452c;
    --green: #3f7d3a;
    --mark: #ffd27a;
    --blank: #fffcee;
    --bar: #fdefb6;
    --display: "IM Hyemin", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font: "IM Hyemin", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #stage { height: 100%; display: flex; align-items: center; justify-content: center;
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); container-type: size; }
  #frame { width: min(100cqw, calc(100cqh * 16 / 9)); height: min(100cqh, calc(100cqw * 9 / 16));
    background: var(--bg); border: 3px solid var(--line); border-radius: 10px; overflow: hidden;
    font-size: calc(min(100cqw, calc(100cqh * 16 / 9)) / 50); }
  #app { height: 100%; display: flex; flex-direction: column; }

  header.top { display: flex; align-items: center; gap: 1.2em; height: 3.4em; padding: 0 1.4em;
    background: var(--bar); border-bottom: 3px solid var(--line); }
  header.top .unit { font-family: var(--display); font-size: 1.15em; }
  header.top .tabs { display: flex; gap: 0.5em; margin: 0 auto; }
  header.top .tabs button { border: 2px solid var(--line); background: var(--paper); padding: 0.25em 1em;
    border-radius: 999px; font-family: var(--display); font-size: 1em; }
  header.top .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  header.top .tabs button:disabled { color: var(--faint); border-color: var(--faint); cursor: default; }
  header.top .page { font-family: var(--display); color: var(--sub); }

  main { flex: 1; position: relative; overflow: hidden; }
  section.slide { position: absolute; inset: 0; padding: 1.5em 2.8em; display: none; flex-direction: column; }
  section.slide.on { display: flex; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 3.4em; margin: 0; color: var(--accent); text-wrap: balance; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 1.9em; margin: 0 0 0.7em; text-wrap: balance; }
  h2 .tag { display: inline-block; background: var(--green); color: #fff; font-size: 0.7em; padding: 0.1em 0.6em;
    border-radius: 6px; margin-right: 0.5em; vertical-align: 0.15em; }
  p, li { font-size: 1.35em; line-height: 1.6; margin: 0.25em 0; }
  ol, ul { margin: 0; padding-left: 1.4em; }
  li::marker { font-family: var(--display); color: var(--accent); }
  .muted { color: var(--sub); }

  footer.bar { display: flex; align-items: center; height: 3.1em; padding: 0 1.2em; background: var(--bar);
    border-top: 3px solid var(--line); gap: 1.2em; font-family: var(--display); }
  footer.bar .phase { color: var(--faint); font-size: 1.05em; }
  footer.bar .phase.on { color: var(--ink); }
  footer.bar .phase.on::before { content: "● "; color: var(--accent); }
  footer.bar .nav { margin-left: auto; display: flex; align-items: center; gap: 0.6em; font-variant-numeric: tabular-nums; }
  footer.bar .nav button { border: 2px solid var(--line); background: var(--paper); width: 2.2em; height: 2.2em; border-radius: 50%; }
  footer.bar .nav .gear { width: auto; height: auto; border: 0; border-radius: 0; background: none; color: var(--sub); font-size: 0.9em; text-decoration: underline; }

  .cover { justify-content: center; align-items: flex-start; gap: 0.5em; }
  .cover .sub { font-family: var(--display); font-size: 1.6em; }
  .cover .who { margin-top: 1.2em; color: var(--sub); font-size: 1.15em; line-height: 1.7; }

  .score { flex: 1; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line);
    border-radius: 8px; min-height: 0; background: #fff; }
  .score img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .score .empty { color: var(--faint); font-family: var(--display); font-size: 1.6em; }
  .progress { height: 6px; background: var(--soft); margin-top: 0.6em; border-radius: 3px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }
  .seg { margin-top: 0.4em; color: var(--sub); font-family: var(--display); font-size: 1.1em; min-height: 1.4em; font-variant-numeric: tabular-nums; }

  .jg { display: inline-grid; border: 3px solid var(--line); background: var(--paper); }
  .jg .h { grid-row: 1; height: 1.6em; text-align: center; font-family: var(--display); color: var(--accent); background: var(--bg); }
  .jg .beatno { grid-row: 1; grid-column: span 3; text-align: center; font-family: var(--display); font-size: 0.95em;
    color: var(--sub); background: var(--bar); border-bottom: 2px solid var(--line); }
  .jg .c { height: 2.1em; display: flex; align-items: center; justify-content: center; font-family: var(--display);
    font-size: 1.6em; border-right: 1px dashed var(--faint); }
  .jg .c.b3 { border-right: 3px solid var(--line); }
  .jg .c:last-child { border-right: 0; }
  .jg .c.strong { color: var(--accent); }
  .jg .c.blank { background: var(--blank); }
  .jg .c.hl { background: var(--mark); }
  .jg-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 0.4em; }
  .row { display: flex; gap: 2.4em; align-items: flex-start; }
  .knee { margin-top: 1em; display: flex; flex-wrap: wrap; gap: 0.4em 2em; font-size: 1.4em; }
  .knee b { font-family: var(--display); color: var(--accent); margin-right: 0.2em; }

  .reveal { margin-top: 0.8em; border: 2px solid var(--line); background: var(--paper); padding: 0.3em 1.2em;
    font-family: var(--display); font-size: 1.15em; align-self: flex-start; border-radius: 999px; }
  .answer { font-family: var(--display); font-size: 1.6em; color: var(--accent); margin-top: 0.5em; min-height: 1.6em; }

  .cards { display: grid; grid-template-columns: repeat(4, auto); gap: 1.2em; justify-content: start; margin-top: 0.4em; }
  .card .no { font-family: var(--display); font-size: 1.8em; color: var(--green); margin-bottom: 0.2em; }

  .cond li { font-size: 1.4em; margin: 0.35em 0; line-height: 1.5; }

  .timer { display: flex; align-items: center; gap: 0.8em; margin-top: 1.2em; }
  .timer button { border: 2px solid var(--line); background: var(--paper); padding: 0.3em 1.2em;
    font-family: var(--display); font-size: 1.15em; border-radius: 999px; }
  .timer .t { font-family: var(--display); font-size: 2.4em; font-variant-numeric: tabular-nums; min-width: 2.4em; }
  .timer .t.end { color: var(--accent); }

  .room { display: grid; grid-template-columns: repeat(3, 6em); gap: 0.4em 0.8em; text-align: center; font-size: 0.95em; }
  .room .front { grid-column: 1 / 4; background: var(--green); color: #fff; padding: 0.2em; font-family: var(--display); border-radius: 4px; }
  .room .tj { grid-column: 2; border: 2px solid var(--accent); background: var(--paper); color: var(--accent); padding: 0.2em; font-family: var(--display); border-radius: 6px; }
  .room .col { color: var(--sub); font-family: var(--display); }
  .room .g { border: 2px solid var(--line); background: var(--paper); padding: 0.35em; font-size: 1.15em; border-radius: 6px; }
  .room .d { background: var(--accent); color: #fff; padding: 0.2em; font-family: var(--display); border-radius: 6px; }
  table.turn { border-collapse: collapse; font-size: 1.1em; background: var(--paper); }
  table.turn th, table.turn td { border: 2px solid var(--line); padding: 0.35em 0.6em; text-align: center; }
  table.turn th { background: var(--bar); font-family: var(--display); font-weight: 400; }
  table.turn td.rest { color: var(--faint); }
  .count { margin-top: 0.9em; font-family: var(--display); font-size: 1.7em; color: var(--accent); letter-spacing: 0.3em; }

  .order { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.6em; }
  .order button { border: 2px solid var(--line); background: var(--paper); padding: 0.8em 0.2em; border-radius: 8px; }
  .order .g { font-family: var(--display); font-size: 1.6em; display: block; }
  .order .v { font-size: 1.15em; color: var(--sub); }
  .order button.on { background: var(--mark); }
  .order button.done { opacity: 0.45; }
  .guess { margin-top: 1.4em; font-family: var(--display); font-size: 2.2em; }
  .guess small { display: block; font-family: var(--font); font-size: 0.5em; color: var(--sub); margin-top: 0.3em; }

  .story { display: flex; flex-direction: column; gap: 0.6em; }
  .qa { display: grid; grid-template-columns: 6em 1fr; align-items: stretch; border: 2px solid var(--line); background: var(--paper); }
  .qa .who { background: var(--bar); border-right: 2px solid var(--line); display: flex; align-items: center;
    justify-content: center; font-family: var(--display); font-size: 1.2em; }
  .qa .say { font-size: 1.45em; padding: 0.35em 0.8em; text-align: left; border: 0; background: none; }
  .qa .ans { font-family: var(--display); color: var(--accent); }
  .qa .ans.open { color: var(--ink); font-family: var(--font); }
  .word { margin-top: 0.6em; display: flex; align-items: baseline; gap: 0.8em; font-size: 1.4em; }
  .word b { font-family: var(--display); background: var(--green); color: #fff; padding: 0.05em 0.6em; border-radius: 6px; }
  .story + .word + p { margin-top: 0.8em; font-size: 1.2em; }
  .tips { display: flex; flex-direction: column; gap: 0.9em; }
  .tip { display: grid; grid-template-columns: 7.2em 1fr; align-items: baseline; gap: 1em; font-size: 1.5em; }
  .tip b { font-family: var(--display); color: var(--accent); }
  #panel { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: min(24rem, calc(100vw - 32px)); max-height: 85vh; overflow: auto; background: var(--paper); color: var(--ink);
    border: 2px solid var(--line); border-radius: 8px; padding: 1em 1.2em; font-size: 14px; z-index: 10; }
  #panel h3 { margin: 0 0 0.6em; font-family: var(--display); font-weight: 400; font-size: 16px; }
  #panel label { display: block; margin: 0.7em 0 0.2em; font-weight: 700; }
  #panel input[type=file] { max-width: 100%; }
  #panel input[type=number] { width: 6em; }
  #panel .st { color: var(--green); font-size: 12px; margin-left: 0.4em; font-weight: 400; }
  #panel .rowp { display: flex; gap: 0.6em; align-items: center; flex-wrap: wrap; margin-top: 0.5em; }
  #panel .rowp label { margin: 0; }
  #panel button { border: 2px solid var(--line); background: var(--bar); padding: 0.2em 0.8em; border-radius: 6px; }
  #panel hr { border: 0; border-top: 1px solid var(--soft); margin: 1em 0; }

  .qa .who, .word b, .tip b, .qa .ans,
  h1, h2, .unit, .jg .c, .jg .h, .card .no, .order .g, .guess, .count, .answer, .reveal, .timer button, .timer .t,
  header.top .tabs button, header.top .page, footer.bar .phase.on, .room .front, .room .tj, .room .d, table.turn th,
  .cover .sub, .seg { font-weight: 700; }
</style>

  var cfg = { start: 0, len: 3, count: 4 };
  var embedded = {};
  try { embedded = JSON.parse(document.getElementById("assets").textContent || "{}"); } catch (e) {}

  // 자진모리장단: 4박, 한 박은 세 칸. STRONG은 세게 치는 칸
  var BASIC = [["덩", "", ""], ["쿵", "", ""], ["쿵", "", "덕"], ["쿵", "", ""]];
  var STRONG = [[0, 0], [2, 2]];
  var CARDS = [["덩", "", ""], ["쿵", "", "덕"], ["덕", "", "덕"], ["쿵", "쿵", ""]];
  var NO = ["①", "②", "③", "④"];

  function isStrong(b, k) { return STRONG.some(function (p) { return p[0] === b && p[1] === k; }); }
  function jg(beats, opt) {
    opt = opt || {};
    var h = '<div class="jg" style="grid-template-columns:repeat(' + beats.length * 3 + ',' + (opt.w || "3.4em") + ')">';
    if (opt.marks) {
      for (var b = 0; b < beats.length; b++) for (var k = 0; k < 3; k++)
        h += '<div class="h">' + (isStrong(b, k) ? "&gt;" : "") + "</div>";
    } else if (opt.beatNo) {
      for (var n = 0; n < beats.length; n++) h += '<div class="beatno">' + (n + 1) + "박</div>";
    }
    beats.forEach(function (beat, b) {
      beat.forEach(function (v, k) {
        var cls = "c" + (k === 2 && b < beats.length - 1 ? " b3" : "");
        if (opt.marks && isStrong(b, k)) cls += " strong";
        if (opt.blank && opt.blank.indexOf(b) >= 0) cls += " blank";
        h += '<div class="' + cls + '" data-beat="' + b + '">' + v + "</div>";
      });
    });
    return h + "</div>";
  }

  var SLIDES = [
    { phase: "", html:
      '<section class="slide cover"><h1>참새 노래</h1>' +
      '<div class="sub">자진모리장단의 장단꼴을 바꾸어 장구로 반주하기</div>' +
      '<div class="who">3학년 음악, 신나는 자진모리장단 3/3차시<br>김시온</div></section>' },

    { phase: "도입", song: true, html:
      '<section class="slide"><div class="score" id="score"></div>' +
      '<div class="progress"><i id="prog"></i></div><div class="seg" id="seg"></div></section>' },

    { phase: "도입", html:
      '<section class="slide"><h2>참새 노래 이야기</h2><div class="story">' +
      '<div class="qa"><div class="who">묻기</div><div class="say">참새에게 어디 가는지 물어요</div></div>' +
      '<div class="qa"><div class="who">1절 대답</div><button class="say ans" data-t="알을 낳으러 가요">?</button></div>' +
      '<div class="qa"><div class="who">2절 대답</div><button class="say ans" data-t="아기에게 밥을 주러 가요">?</button></div></div>' +
      '<div class="word"><b>처마</b><span>지붕 끝이 벽 밖으로 튀어나온 부분</span></div>' +
      '<p class="muted">옛날부터 전해 오는 노랫말에 이성천 선생님이 가락을 붙인 노래</p></section>' },

    { phase: "도입", html:
      '<section class="slide"><h2>이렇게 불러요</h2><div class="tips">' +
      '<div class="tip"><b>같은 가락</b><span>묻는 부분과 대답하는 부분은 가락이 똑같아요</span></div>' +
      '<div class="tip"><b>자진모리장단</b><span>조금 빠르고 신나는 장단</span></div>' +
      "<div class=\"tip\"><b>이어 부르기</b><span>'가-니', '간-다'는 끊지 않고 길게</span></div>" +
      "</div></section>" },

    { phase: "도입", html:
      '<section class="slide"><h2>학습 목표</h2>' +
      "<p>장단의 두 박을 바꾸어 우리 모둠 장단을 만들고, 그 장단으로 반주하며 노래하기</p>" +
      '<ol style="margin-top:1.4em"><li>자진모리장단의 장단꼴 알기</li>' +
      "<li>두 박의 장단꼴 바꾸기</li><li>바꾼 장단으로 장구 반주하기</li></ol></section>" },

    { phase: "전개", html:
      '<section class="slide"><h2><span class="tag">활동 1</span>자진모리장단의 장단꼴</h2>' +
      '<div class="jg-wrap">' + jg(BASIC, { marks: true }) +
      '<div class="muted" style="font-size:1.15em">한 장단은 4박, 한 박은 세 칸</div></div>' +
      '<div class="knee"><span><b>덩</b> 양쪽 무릎</span><span><b>쿵</b> 왼쪽 무릎</span>' +
      "<span><b>덕</b> 오른쪽 무릎</span></div></section>" },

    { phase: "전개", html:
      '<section class="slide"><h2><span class="tag">활동 2</span>몇째 박과 몇째 박이 달라졌을까요?</h2>' +
      '<div id="whichJg">' + jg(BASIC, { beatNo: true }) + "</div>" +
      '<button class="reveal" id="reveal">정답</button><div class="answer" id="answer"></div></section>' },

    { phase: "전개", html:
      '<section class="slide"><h2>장단꼴 바꾸기 조건</h2><ol class="cond">' +
      "<li>첫째 박 '덩'은 그대로 두고, 둘째·셋째·넷째 박 중 두 박을 고른다.</li>" +
      "<li>바꿀 두 박에 넣을 카드를 고른다. 같은 카드를 두 번 써도 된다.</li>" +
      "<li>바꾼 박은 카드의 구음을, 바꾸지 않은 박은 기본 장단을 옮겨 적는다.</li></ol></section>" },

    { phase: "전개", html:
      '<section class="slide"><h2>장단 꾸러미 카드</h2><div class="cards">' +
      CARDS.map(function (c, i) { return '<div class="card"><div class="no">' + NO[i] + "</div>" + jg([c], { w: "3em" }) + "</div>"; }).join("") +
      "</div></section>" },

    { phase: "전개", accomp: true, html:
      '<section class="slide"><h2>우리 모둠 장단</h2>' +
      jg([["덩", "", ""], ["", "", ""], ["", "", ""], ["", "", ""]], { beatNo: true, blank: [1, 2, 3] }) +
      '<p style="margin-top:1em">장단 이름: ______________ 장단</p>' +
      '<div class="timer"><button id="tBtn">30초</button><span class="t" id="tVal"></span></div></section>' },

    { phase: "전개", html:
      '<section class="slide"><h2><span class="tag">활동 3</span>장구 연습 차례</h2><div class="row">' +
      '<div class="room"><div class="front">칠판</div><div></div><div class="tj">교사 장구</div><div></div>' +
      '<div class="col">1분단</div><div class="col">2분단</div><div class="col">3분단</div>' +
      '<div class="g">1모둠</div><div class="g">3모둠</div><div class="g">5모둠</div>' +
      '<div class="d">장구</div><div class="d">장구</div><div class="d">장구</div>' +
      '<div class="g">2모둠</div><div class="g">4모둠</div><div class="g">6모둠</div></div>' +
      '<div><table class="turn"><tr><th></th><th>1분단</th><th>2분단</th><th>3분단</th><th>교사</th></tr>' +
      "<tr><th>1차</th><td>1모둠</td><td>4모둠</td><td>5모둠</td><td>3모둠</td></tr>" +
      '<tr><th>2차</th><td>2모둠</td><td class="rest">쉼</td><td>6모둠</td><td class="rest">쉼</td></tr></table>' +
      '<p style="margin-top:1em">한 사람이 두 장단씩 치고 채를 장구 위에 내려놓기</p>' +
      '<div class="count">하나 둘 셋 넷</div></div></div></section>' },

    { phase: "전개", html:
      '<section class="slide"><h2>모둠마다 한 절씩 반주하기</h2><div class="order" id="order">' +
      [1, 2, 3, 4, 5, 6].map(function (g) {
        return '<button data-g="' + g + '"><span class="g">' + g + '모둠</span><span class="v">' + (g % 2 ? "1절" : "2절") + "</span></button>";
      }).join("") + "</div>" +
      '<div class="guess">몇째 박과 몇째 박? 하나, 둘, 셋!<small>양손 손가락으로 바뀐 두 박의 번호 들기</small></div></section>' },

    { phase: "정리", html:
      '<section class="slide"><h2>정리</h2><p>장단꼴을 바꾸니 노래가 어떻게 달라졌나요?</p>' +
      '<p style="margin-top:1.6em" class="muted">다음 시간</p><p>다른 박의 장단꼴도 바꾸어 연주하기</p></section>' }
  ];

  var app = document.getElementById("app");
  app.innerHTML =
    '<header class="top"><span class="unit">신나는 자진모리장단</span>' +
    '<div class="tabs" id="tabs">' +
    '<button data-a="score">악보 보기</button><button data-a="song">노래 듣기</button>' +
    '<button data-a="follow">따라 부르기</button><button data-a="kye">계명창 듣기</button><button data-a="accomp">반주 듣기</button></div>' +
    '<span class="page">16~17쪽</span></header>' +
    "<main>" + SLIDES.map(function (s) { return s.html; }).join("") + "</main>" +
    '<footer class="bar"><span class="phase" data-p="도입">도입</span><span class="phase" data-p="전개">전개</span>' +
    '<span class="phase" data-p="정리">정리</span><div class="nav"><button id="prev" aria-label="이전">◀</button>' +
    '<span id="pno"></span><button id="next" aria-label="다음">▶</button><button class="gear" id="gear">자료</button></div></footer>';

  var panel = document.createElement("div");
  panel.id = "panel"; panel.hidden = true;
  panel.innerHTML = '<h3>자료 넣기</h3>' +
    '<label for="f-score">악보 이미지<span class="st" id="st-score"></span></label><input id="f-score" type="file" accept="image/*" data-k="score">' +
    '<label for="f-song">노래 음원<span class="st" id="st-song"></span></label><input id="f-song" type="file" accept="audio/*" data-k="song">' +
    '<label for="f-accomp">반주 음원<span class="st" id="st-accomp"></span></label><input id="f-accomp" type="file" accept="audio/*" data-k="accomp">' +
    "<hr><h3>따라 부르기</h3>" +
    '<div class="rowp"><label for="c-start">첫 장단 시작(초)</label><input type="number" step="0.1" min="0" id="c-start"><button id="c-here">지금 위치</button></div>' +
    '<div class="rowp"><label for="c-len">한 장단 길이(초)</label><input type="number" step="0.05" min="0.5" id="c-len"></div>' +
    '<div class="rowp"><label for="c-count">장단 수</label><input type="number" step="1" min="1" id="c-count"></div>' +
    '<hr><button id="save">자료를 넣은 파일로 저장</button> <button id="close">닫기</button>';
  document.body.appendChild(panel);

  var slides = app.querySelectorAll("section.slide");
  var cur = 0;

  function show(i) {
    stopAll();
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, k) { s.classList.toggle("on", k === cur); });
    var sd = SLIDES[cur];
    app.querySelectorAll(".phase").forEach(function (p) { p.classList.toggle("on", p.dataset.p === sd.phase); });
    document.getElementById("pno").textContent = (cur + 1) + " / " + slides.length;
    var tabs = document.getElementById("tabs");
    tabs.style.visibility = sd.song || sd.accomp ? "visible" : "hidden";
    tabs.querySelectorAll("button").forEach(function (b) {
      var a = b.dataset.a;
      b.hidden = !(sd.song || a === "accomp");
      b.disabled = a === "score" ? !assets.score : !assets[a === "follow" ? "song" : a];
      b.classList.toggle("on", !!sd.song && a === "score");
    });
  }

  /* 음원 */
  var player = new Audio();
  var urls = {};
  var mode = null, followIdx = 0, gapUntil = 0, tick = null;

  function setTab(a) {
    document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.a === a); });
  }
  function stopAll() {
    player.pause();
    clearInterval(tick); tick = null; mode = null;
    var p = document.getElementById("prog"); if (p) p.style.width = "0";
    var s = document.getElementById("seg"); if (s) s.textContent = "";
    setTab(SLIDES[cur] && SLIDES[cur].song ? "score" : null);
  }
  function play(kind) {
    if (mode === kind) { stopAll(); return; }
    stopAll();
    var key = kind === "follow" ? "song" : kind;
    if (!urls[key]) return;
    player.src = urls[key];
    mode = kind; setTab(kind);
    if (kind === "follow") {
      followIdx = 0; gapUntil = 0;
      player.currentTime = cfg.start;
      player.play().catch(stopAll);
      tick = setInterval(followStep, 30);
    } else {
      player.currentTime = 0;
      player.play().catch(stopAll);
      tick = setInterval(function () {
        var p = document.getElementById("prog");
        if (p && player.duration) p.style.width = (player.currentTime / player.duration * 100) + "%";
      }, 100);
    }
  }
  function followStep() {
    var seg = document.getElementById("seg"), p = document.getElementById("prog");
    var now = performance.now();
    if (gapUntil) {
      if (now < gapUntil) return;
      gapUntil = 0; followIdx++;
      if (followIdx >= cfg.count) { stopAll(); return; }
      player.currentTime = cfg.start + followIdx * cfg.len;
      player.play().catch(stopAll);
    }
    var end = cfg.start + (followIdx + 1) * cfg.len;
    if (seg) seg.textContent = (followIdx + 1) + "장단 / " + cfg.count + "장단";
    if (p) p.style.width = ((followIdx + Math.min(1, Math.max(0, (player.currentTime - cfg.start - followIdx * cfg.len) / cfg.len))) / cfg.count * 100) + "%";
    if (!player.paused && player.currentTime >= end) {
      player.pause();
      gapUntil = now + cfg.len * 1000;
      if (seg) seg.textContent = (followIdx + 1) + "장단 / " + cfg.count + "장단  따라 부르기";
    }
  }
  player.addEventListener("ended", stopAll);

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.a === "score") { stopAll(); return; }
    play(b.dataset.a);
  });

  function renderScore() {
    var el = document.getElementById("score");
    el.innerHTML = urls.score ? '<img alt="참새 노래 악보" src="' + urls.score + '">' : '<span class="empty">악보</span>';
  }

  /* 브라우저에 자료 보관 (이 기기, 이 브라우저에만 남음) */
  var DB = null;
  function openDb() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open("chamsae", 1);
        r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
        r.onsuccess = function () { DB = r.result; res(); };
        r.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function dbPut(k, v) {
    try { if (DB) DB.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch (e) {}
  }
  function dbGetAll() {
    return new Promise(function (res) {
      var out = {};
      try {
        if (!DB) return res(out);
        var st = DB.transaction("kv").objectStore("kv");
        var keys = ["score", "song", "accomp", "cfg"], left = keys.length;
        keys.forEach(function (k) {
          var g = st.get(k);
          g.onsuccess = function () { if (g.result) out[k] = g.result; if (!--left) res(out); };
          g.onerror = function () { if (!--left) res(out); };
        });
      } catch (e) { res(out); }
    });
  }
  function setAsset(k, v) {
    assets[k] = v;
    if (urls[k] && urls[k].indexOf("blob:") === 0) URL.revokeObjectURL(urls[k]);
    urls[k] = typeof v === "string" ? v : URL.createObjectURL(v);
  }

  /* 활동 2 정답 */
  document.getElementById("reveal").addEventListener("click", function () {
    var ans = document.getElementById("answer"), on = !ans.textContent;
    ans.textContent = on ? "둘째 박, 넷째 박" : "";
    document.querySelectorAll("#whichJg .c").forEach(function (c) {
      c.classList.toggle("hl", on && (c.dataset.beat === "1" || c.dataset.beat === "3"));
    });
  });

  document.querySelectorAll(".ans").forEach(function (el) {
    el.addEventListener("click", function () {
      var open = el.classList.toggle("open");
      el.textContent = open ? el.dataset.t : "?";
    });
  });

  /* 30초 */
  var tTimer = null;
  document.getElementById("tBtn").addEventListener("click", function () {
    var el = document.getElementById("tVal"), left = 30;
    clearInterval(tTimer); el.classList.remove("end"); el.textContent = left;
    tTimer = setInterval(function () {
      left--; el.textContent = left;
      if (left <= 0) { clearInterval(tTimer); el.classList.add("end"); el.textContent = "끝"; }
    }, 1000);
  });

  /* 이어 반주 순서 */
  document.getElementById("order").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var g = +b.dataset.g;
    document.querySelectorAll("#order button").forEach(function (x) {
      var n = +x.dataset.g;
      x.classList.toggle("on", n === g);
      x.classList.toggle("done", n < g);
    });
  });

  /* 넘기기 */
  document.getElementById("prev").onclick = function () { show(cur - 1); };
  document.getElementById("next").onclick = function () { show(cur + 1); };
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (["ArrowRight", "PageDown", " "].indexOf(e.key) >= 0) { e.preventDefault(); show(cur + 1); }
    if (["ArrowLeft", "PageUp"].indexOf(e.key) >= 0) { e.preventDefault(); show(cur - 1); }
  });

  /* 자료 넣기 */
  document.getElementById("gear").onclick = function () { panel.hidden = !panel.hidden; };
  document.getElementById("close").onclick = function () { panel.hidden = true; };
  function status() {
    ["score", "song", "accomp"].forEach(function (k) {
      document.getElementById("st-" + k).textContent = assets[k] ? "들어 있음" : "";
    });
    document.getElementById("c-start").value = cfg.start;
    document.getElementById("c-len").value = cfg.len;
    document.getElementById("c-count").value = cfg.count;
  }
  panel.querySelectorAll("input[type=file]").forEach(function (inp) {
    inp.addEventListener("change", function () {
      var f = inp.files[0]; if (!f) return;
      setAsset(inp.dataset.k, f);
      dbPut(inp.dataset.k, f);
      renderScore(); status(); show(cur);
    });
  });
  ["start", "len", "count"].forEach(function (k) {
    document.getElementById("c-" + k).addEventListener("change", function (e) {
      var v = parseFloat(e.target.value);
      if (!isNaN(v)) cfg[k] = k === "count" ? Math.max(1, Math.round(v)) : Math.max(0, v);
      dbPut("cfg", cfg);
    });
  });
  document.getElementById("c-here").onclick = function () {
    cfg.start = Math.round(player.currentTime * 10) / 10; status(); dbPut("cfg", cfg);
  };

  function toDataUrl(v) {
    return new Promise(function (res) {
      if (typeof v === "string") return res(v);
      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = function () { res(null); };
      r.readAsDataURL(v);
    });
  }
  document.getElementById("save").onclick = function () {
    var keys = ["score", "song", "accomp"];
    Promise.all(keys.map(function (k) { return assets[k] ? toDataUrl(assets[k]) : null; })).then(function (vals) {
      var data = { cfg: cfg };
      keys.forEach(function (k, i) { if (vals[i]) data[k] = vals[i]; });
      var copy = document.documentElement.cloneNode(true);
      copy.querySelector("#app").innerHTML = "";
      var pn = copy.querySelector("#panel"); if (pn) pn.remove();
      copy.querySelector("#assets").textContent = JSON.stringify(data).replace(/</g, "\\u003c");
      var blob = new Blob(["<!doctype html>\n" + copy.outerHTML], { type: "text/html" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "참새노래_수업화면.html";
      document.body.appendChild(a); a.click(); a.remove();
    });
  };

  ["score", "song", "kye", "accomp"].forEach(function (k) { if (embedded[k]) setAsset(k, embedded[k]); });
  if (embedded.cfg) Object.assign(cfg, embedded.cfg);
  renderScore(); status(); show(0);
  openDb().then(dbGetAll).then(function (saved) {
    ["score", "song", "accomp"].forEach(function (k) { if (saved[k] && !embedded[k]) setAsset(k, saved[k]); });
    if (saved.cfg && !embedded.cfg) Object.assign(cfg, saved.cfg);
    renderScore(); status(); show(cur);
  });
})();
</script>
</body>
</html>
